# CVTUR: the centres of the 80 provincial capitals of Türkiye other than Karabük.
# cvgl-scrape run --config configs/cvtur.yaml
# cvgl-scrape export --config configs/cvtur.yaml --to CVTUR --pairs 100000

out: data/raw/cvtur
areas: configs/areas/turkiye.yaml
spacing: 80

# One panorama per 20 m cell, the same number from every city;
# 3 % more than needed, as some panoramas are no longer available
thin: 20
target: 103000
balance: true
seed: 0

ground_size: 1232x324
aerial_size: 256
zoom: 19
