[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvgl-streetview-scrape"
version = "0.1.0"
description = "Collection of paired ground-level and aerial images for cross-view geo-localization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.9",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cvgl-scrape = "cvgl_scrape.cli:main"

[tool.setuptools]
packages = ["cvgl_scrape"]
