## AREA

# Center of area to search for panoramas
center: [41.2074, 32.6564]
# Radius in kilometres
radius: 1.2
# Number of grid steps per side; spacing is about 2 * radius / resolution
resolution: 60
# Optional GeoJSON polygon; panoramas outside of it are dropped
boundary: boundaries/karabuk_university.geojson

## IMAGES

# Ground view: north-aligned panorama strip centred on the horizon
panorama:
  width: 1232
  height: 324

# Aerial view: north-up patch centred on the panorama position
satellite:
  zoom: 19
  size: 256
